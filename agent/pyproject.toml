[project]
name = "api"
version = "0.1.0"
description = "Challenge 2026 agent API for the Godot game server"
requires-python = ">=3.11"
dependencies = [
    "websockets>=15",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "integration: boots the real Godot server; slow. Deselect with -m 'not integration'.",
    "bundle: runs the built agent bundle under build/; skips if not built.",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15.14",
]
