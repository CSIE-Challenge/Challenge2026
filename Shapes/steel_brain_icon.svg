  <circle cx="70" cy="30" r="2.2" fill="#e8eef4" stroke="#39434d" stroke-width="0.8"/>
  <circle cx="50" cy="63" r="2.2" fill="#e8eef4" stroke="#39434d" stroke-width="0.8"/>
