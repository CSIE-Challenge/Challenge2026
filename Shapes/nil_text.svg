<svg width="36" height="15" viewBox="0 0 36 15"
    xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Pixel art "NIL" — 3 SVG units per pixel, white fill for modulate control -->
  <!-- N (4×5 at x=0) -->
  <rect x="0"  y="0"  width="3" height="3" fill="#ffffff"/>
  <rect x="9"  y="0"  width="3" height="3" fill="#ffffff"/>
  <rect x="0"  y="3"  width="3" height="3" fill="#ffffff"/>
  <rect x="3"  y="3"  width="3" height="3" fill="#ffffff"/>
  <rect x="9"  y="3"  width="3" height="3" fill="#ffffff"/>
  <rect x="0"  y="6"  width="3" height="3" fill="#ffffff"/>
  <rect x="6"  y="6"  width="3" height="3" fill="#ffffff"/>
  <rect x="9"  y="6"  width="3" height="3" fill="#ffffff"/>
  <rect x="0"  y="9"  width="3" height="3" fill="#ffffff"/>
  <rect x="9"  y="9"  width="3" height="3" fill="#ffffff"/>
  <rect x="0"  y="12" width="3" height="3" fill="#ffffff"/>
  <rect x="9"  y="12" width="3" height="3" fill="#ffffff"/>
  <!-- I (3×5 with serifs at x=15) -->
  <rect x="15" y="0"  width="9" height="3" fill="#ffffff"/>
  <rect x="18" y="3"  width="3" height="9" fill="#ffffff"/>
  <rect x="15" y="12" width="9" height="3" fill="#ffffff"/>
  <!-- L (3×5 at x=27) -->
  <rect x="27" y="0"  width="3" height="12" fill="#ffffff"/>
  <rect x="27" y="12" width="9" height="3"  fill="#ffffff"/>
</svg>
