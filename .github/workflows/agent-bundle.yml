name: Agent Bundle

# Builds the per-platform Python agent bundles (agent-<os>-<arch>.zip) natively
# on each OS runner and attaches them to the release for the pushed tag.
# Asset names must match launcher.gd::_get_agent_asset_name() in
# CSIE-Challenge/Challenge2026-Launcher.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x86_64
          - runner: windows-latest
            label: windows-x86_64
          - runner: macos-latest
            label: macos-aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Build bundle
        run: ./build_agent_bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.label }}
          path: agent/build/agent-${{ matrix.label }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload bundles to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
